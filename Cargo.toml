[workspace]
resolver = "2"
members = [
    "crates/arkdown-core",
    "crates/arkdown-config",
    "crates/arkdown-resolver",
    "crates/arkdown-loader",
    "crates/arkdown",
    "crates/arkdown-plugin-json5",
    "crates/arkdown-plugin-duplicate-check",
    "crates/arkdown-plugin-module-meta",
    "crates/arkdown-plugin-ohos-resolve",
    "crates/arkdown-plugin-har-dedup",
    "crates/arkdown-plugin-router-map",
    "crates/arkdown-plugin-sensitive-check",
    "crates/arkdown-plugin-ets-transform",
    "crates/arkdown-abc",
    "crates/arkdown-ts2abc",
    "crates/arkdown-resource",
    "crates/arkdown-profile",
    "crates/arkdown-pack",
    "crates/arkdown-cache",
    "crates/arkdown-sign",
    "crates/arkdown-cli",
    "crates/arkdown-obfuscate",
    "crates/arkdown-watcher",
]

[workspace.dependencies]
# Workspace crates
arkdown = { path = "crates/arkdown" }
arkdown-abc = { path = "crates/arkdown-abc" }
arkdown-cache = { path = "crates/arkdown-cache" }
arkdown-config = { path = "crates/arkdown-config" }
arkdown-core = { path = "crates/arkdown-core" }
arkdown-loader = { path = "crates/arkdown-loader" }
arkdown-obfuscate = { path = "crates/arkdown-obfuscate" }
arkdown-pack = { path = "crates/arkdown-pack" }
arkdown-plugin-duplicate-check = { path = "crates/arkdown-plugin-duplicate-check" }
arkdown-plugin-ets-transform = { path = "crates/arkdown-plugin-ets-transform" }
arkdown-plugin-json5 = { path = "crates/arkdown-plugin-json5" }
arkdown-plugin-module-meta = { path = "crates/arkdown-plugin-module-meta" }
arkdown-plugin-ohos-resolve = { path = "crates/arkdown-plugin-ohos-resolve" }
arkdown-plugin-router-map = { path = "crates/arkdown-plugin-router-map" }
arkdown-profile = { path = "crates/arkdown-profile" }
arkdown-resolver = { path = "crates/arkdown-resolver" }
arkdown-resource = { path = "crates/arkdown-resource" }
arkdown-sign = { path = "crates/arkdown-sign" }
arkdown-ts2abc = { path = "crates/arkdown-ts2abc" }
arkdown-watcher = { path = "crates/arkdown-watcher" }

# Parser — ohos-rs/oxc fork pinned rev (DO NOT use floating branch or crates.io oxc)
oxc = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee", features = ["full"] }
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_ast = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_parser = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_semantic = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_span = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_ast_visit = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_syntax = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_transformer = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_codegen = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_minifier = { git = "https://github.com/ohos-rs/oxc", rev = "c8d02452469e159952f0181b022c1f304e77abee" }
oxc_resolver = "11.20.0"

# Rolldown
rolldown = { version = "1.0.3", default-features = false }
rolldown_common = "1.0.3"
rolldown_plugin = "1.0.3"
rolldown_sourcemap = "1.0.3"
rolldown_utils = "1.0.3"
string_wizard = { version = "1.0.3", features = ["sourcemap"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Data structures
rustc-hash = "2"
index_vec = "0.1"
bitflags = "2"
indexmap = { version = "2", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Source maps
sourcemap = "9"

# File system
fs-err = "3"
walkdir = "2"

# Parallel
rayon = "1"

# ZIP
zip = "2"

# CLI
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem watching
notify = "6"

# Channels
crossbeam-channel = "0.5"

# Regex
regex = "1"

# Cryptography — pure Rust HAP signing (arkdown-sign, SPEC-021)
p256        = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rsa         = { version = "0.9",  features = ["sha2", "pem"] }
sha2        = "0.10"
signature   = "2"
der         = "0.7"
x509-cert   = { version = "0.2", features = ["pem"] }
pkcs12      = "0.1"
pkcs5       = { version = "0.7", features = ["pbes2"] }
pkcs8       = { version = "0.10", features = ["alloc", "pkcs5"] }
cms         = "0.2"
const-oid   = { version = "0.9", features = ["db"] }
spki        = "0.7"
rand        = "0.8"
p12         = "0.6"
aes-gcm     = "0.10"
aes         = { version = "0.8", features = ["zeroize"] }
cbc         = "0.1"
pbkdf2      = { version = "0.12", default-features = false, features = ["hmac"] }
hex         = "0.4"
hex-literal = "0.4"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

# ---------------------------------------------------------------------------
# NOTE: No [patch.crates-io] is used for oxc.
#
# Our workspace crates (arkdown-plugin-ets-transform, arkdown-loader, etc.) use
# the ohos-rs/oxc fork (rev c8d02452) via [workspace.dependencies] for ArkTS
# (.ets) parser support.
#
# rolldown 1.0.3 uses upstream crates.io oxc 0.133.0.  No oxc types cross the
# plugin adapter boundary — only Rust Strings (source code) and our own
# structs are exchanged — so the two copies of oxc coexist without conflict.
# Patching rolldown's oxc deps to the fork would cause an oxc_sourcemap v6/v7
# type mismatch in rolldown_ecmascript and must NOT be done.
# ---------------------------------------------------------------------------
