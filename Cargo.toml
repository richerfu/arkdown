[workspace]
resolver = "2"
members = [
    "crates/arkdown-core",
    "crates/arkdown-path",
    "crates/arkdown-ohos-schema",
    "crates/arkdown-config",
    "crates/arkdown-resolver",
    "crates/arkdown",
    "crates/arkdown-ets-transform",
    "crates/arkdown-ets-checker",
    "crates/arkdown-resource",
    "crates/arkdown-profile",
    "crates/arkdown-pack",
    "crates/arkdown-cache",
    "crates/arkdown-abc",
    "crates/arkdown-build",
    "crates/arkdown-native",
    "crates/arkdown-sign",
    "crates/arkdown-obfuscate",
    "crates/arkdown-watcher",
    "crates/arkdown-session",
    # Node.js NAPI binding — built by `npm run build` in packages/arkdown/.
    # Part of the workspace so cargo uses a unified dependency graph and avoids
    # rolldown version conflicts from a separate [workspace] resolution.
    "packages/arkdown",
]

[workspace.dependencies]
# Workspace crates
arkdown = { path = "crates/arkdown" }
arkdown-abc = { path = "crates/arkdown-abc" }
arkdown-build = { path = "crates/arkdown-build" }
arkdown-cache = { path = "crates/arkdown-cache" }
arkdown-config = { path = "crates/arkdown-config" }
arkdown-core = { path = "crates/arkdown-core" }
arkdown-ets-transform = { path = "crates/arkdown-ets-transform" }
arkdown-ets-checker = { path = "crates/arkdown-ets-checker" }
arkdown-obfuscate = { path = "crates/arkdown-obfuscate" }
arkdown-ohos-schema = { path = "crates/arkdown-ohos-schema" }
arkdown-native = { path = "crates/arkdown-native" }
arkdown-pack = { path = "crates/arkdown-pack" }
arkdown-path = { path = "crates/arkdown-path" }
arkdown-profile = { path = "crates/arkdown-profile" }
arkdown-resolver = { path = "crates/arkdown-resolver" }
arkdown-resource = { path = "crates/arkdown-resource" }
arkdown-session = { path = "crates/arkdown-session" }
arkdown-sign = { path = "crates/arkdown-sign" }
arkdown-watcher = { path = "crates/arkdown-watcher" }

# Full Rust OHPM implementation. Arkdown invokes its library API before the
# immutable build session is captured; no OHPM subprocess or duplicate
# package-acquisition implementation remains in this workspace.
ohpm-core = "=0.2.0"

# OpenHarmony signing backend. Keep the CLI disabled: arkdown owns project
# discovery and orchestration, while hapsigner owns the signing formats.
hapsigner = { version = "0.2.0", default-features = false }

# Parser — ohos-rs OXC fork with ArkTS/ArkUI support.
oxc = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db", features = ["full"] }
oxc_allocator = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_ast = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_parser = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_semantic = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db", features = ["jsdoc"] }
oxc_span = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_sourcemap = "8.1.2"
oxc_str = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_ast_visit = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_syntax = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_transformer = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_isolated_declarations = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_codegen = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_diagnostics = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_minifier = { git = "https://github.com/ohos-rs/oxc", rev = "3f2b4b7d5338c10014c973e0db874ec2d3b655db" }
oxc_resolver = "11.21.3"

# Rolldown
rolldown = { git = "https://github.com/ohos-rs/rolldown", rev = "3aac1451ad00e255acfaaecb5c94fc2d52c31c03", default-features = false, features = ["experimental"] }
rolldown_common = { git = "https://github.com/ohos-rs/rolldown", rev = "3aac1451ad00e255acfaaecb5c94fc2d52c31c03" }
rolldown_plugin = { git = "https://github.com/ohos-rs/rolldown", rev = "3aac1451ad00e255acfaaecb5c94fc2d52c31c03" }
rolldown_sourcemap = { git = "https://github.com/ohos-rs/rolldown", rev = "3aac1451ad00e255acfaaecb5c94fc2d52c31c03" }
rolldown_utils = { git = "https://github.com/ohos-rs/rolldown", rev = "3aac1451ad00e255acfaaecb5c94fc2d52c31c03" }
rolldown_error = { git = "https://github.com/ohos-rs/rolldown", rev = "3aac1451ad00e255acfaaecb5c94fc2d52c31c03" }
string_wizard = "=1.2.4"

# NAPI-RS (Node.js native addon bridge — used by packages/arkdown)
napi = { version = "3.9.1", features = [
  "async",
  "napi4",
  "tokio_rt",
  "compat-mode",
  "serde-json",
] }
napi-derive = "3.5.6"
napi-build = "2"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Data structures
rustc-hash = "2"
arc-swap = "1.7"
arcstr = { version = "1.2.0", default-features = false }
oxc_index = { version = "5.0.0", features = ["nonmax", "serde"] }
compact_str = { version = "0.8", features = ["serde"] }
bitflags = "2"
indexmap = { version = "2", features = ["serde"] }
bytes = "1"
phf = { version = "0.13.1", features = ["macros"] }
crc32fast = "1"
object = { version = "0.37.3", default-features = false, features = ["elf", "read_core"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
json5 = "0.4"
json-strip-comments = "3"
jsonschema = "0.49.7"
toml = { version = "1.1.4", features = ["preserve_order"] }

# Archive support.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
# Base64 encoding (OHPM integrity verification)
base64 = "0.22"

# Error handling
thiserror = "2"
anyhow = "1"

# Source maps
sourcemap = "9"

# File system
fs-err = "3"
dunce = "1.0.5"
walkdir = "2"
fast-glob = "1.0.1"
globset = "0.4.18"
junction = { version = "2.0.0", default-features = false }

# Parallel
rayon = "1"
regex = "1"

# ZIP
zip = "2"
rawzip = "0.4.4"
time = { version = "0.3", features = ["local-offset"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
dhat = "0.3.3"
memory-stats = "1.2.0"
mimalloc-safe = "0.1.62"

# Filesystem watching
notify = "6"

# Channels
crossbeam-channel = "0.5"

# Cryptography used outside the published hapsigner backend.
# sha2-asm uses GNU assembly sources and cannot be compiled by MSVC. Member
# manifests enable it only for the supported macOS and Linux targets.
sha2        = "0.10"
semver      = "1"
aes-gcm     = "0.10"
pbkdf2      = { version = "0.12", default-features = false, features = ["hmac"] }
hex         = "0.4"
tempfile = "3"

# ohpm-core 0.2.0 resolves through gix 0.86, whose bisync dependency was
# yanked from crates.io. Keep the published OHPM API consumable until the
# gix 0.87 fix from ohpm-rs is released.
[patch.crates-io]
bisync = { git = "https://github.com/JM4ier/bisync", rev = "be3a0a6255a0af592e66be8614a149151f67fdf5" }

[profile.release]
lto = true
codegen-units = 1

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
