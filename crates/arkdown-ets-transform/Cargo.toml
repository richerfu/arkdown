[package]
name = "arkdown-ets-transform"
version = "0.1.0"
edition = "2021"
description = "OXC-based ArkTS/ArkUI transform core (SPEC-048)"

[dependencies]
arkdown-core = { workspace = true }
arkdown-path = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
json5 = { workspace = true }
rustc-hash = { workspace = true }
regex = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
fs-err = { workspace = true }
walkdir = { workspace = true }
# OXC parser/transformer for ArkTS source processing
# Uses ohos-rs/oxc fork with .ets StructStatement support
oxc_allocator = { workspace = true }
oxc_str = { workspace = true }
oxc_ast = { workspace = true }
oxc_parser = { workspace = true }
oxc_codegen = { workspace = true }
oxc_isolated_declarations = { workspace = true }
oxc_semantic = { workspace = true }
oxc_transformer = { workspace = true }
oxc_span = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_syntax = { workspace = true }
rolldown_sourcemap = { workspace = true }
string_wizard = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
junction = { workspace = true }
