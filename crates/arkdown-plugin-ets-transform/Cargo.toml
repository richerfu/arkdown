[package]
name = "arkdown-plugin-ets-transform"
version = "0.1.0"
edition = "2021"

[dependencies]
arkdown-core = { path = "../arkdown-core" }

# Parser and codegen — ohos-rs fork only
oxc_allocator = { workspace = true }
oxc_parser    = { workspace = true }
oxc_ast       = { workspace = true }
oxc_codegen   = { workspace = true }
oxc_semantic  = { workspace = true }
oxc_span      = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_syntax    = { workspace = true }
oxc_transformer = { workspace = true }

# Rolldown plugin API
rolldown_plugin    = "1.0.3"
rolldown_sourcemap = "1.0.3"
string_wizard      = { version = "1.0.3", features = ["sourcemap"] }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

# Serialization (for source map JSON post-processing)
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
