[package]
name = "arkdown"
version = "0.1.0"
edition = "2021"

[dependencies]
arkdown-core = { workspace = true }
arkdown-loader = { workspace = true }
arkdown-profile = { workspace = true }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_codegen = { workspace = true }
oxc_semantic = { workspace = true }
oxc_span = { workspace = true }
oxc_transformer = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
fs-err = { workspace = true }
index_vec = { workspace = true }
rustc-hash = { workspace = true }
# rolldown 1.0.3 — core bundling engine replaces the custom link/tree-shake/chunk-split/codegen stages.
# default-features = false skips NAPI bindings and Vite-specific plugins.
# Workspace-level dependency metadata keeps rolldown versions centralized.
rolldown           = { workspace = true }
rolldown_plugin    = { workspace = true }
rolldown_common    = { workspace = true }
rolldown_sourcemap = { workspace = true }
rolldown_utils     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
arkdown-config = { workspace = true }
arkdown-profile = { workspace = true }
arkdown-plugin-ets-transform = { workspace = true }
arkdown-plugin-ohos-resolve  = { workspace = true }
arkdown-plugin-module-meta   = { workspace = true }
arkdown-plugin-duplicate-check = { workspace = true }
arkdown-plugin-json5         = { workspace = true }
arkdown-resolver             = { workspace = true }
json5 = { workspace = true }
fs-err = { workspace = true }
tempfile = { workspace = true }
