[package]
name = "arkdown-session"
version = "0.1.0"
edition = "2021"

[dependencies]
arkdown-core = { workspace = true }
arkdown-config = { workspace = true }
arkdown-path = { workspace = true }
arkdown-ohos-schema = { workspace = true }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_span = { workspace = true }
oxc_syntax = { workspace = true }
oxc_index = { workspace = true }
compact_str = { workspace = true }
rustc-hash = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
json5 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
walkdir = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
sha2 = { workspace = true, features = ["asm", "asm-aarch64"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
