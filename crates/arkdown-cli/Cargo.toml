[package]
name = "arkdown-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "arkdown"
path = "src/main.rs"

[dependencies]
arkdown-core = { path = "../arkdown-core" }
arkdown-config = { path = "../arkdown-config" }
arkdown-profile = { path = "../arkdown-profile" }
arkdown-resource = { path = "../arkdown-resource" }
arkdown = { path = "../arkdown" }
arkdown-abc = { path = "../arkdown-abc" }
arkdown-pack = { path = "../arkdown-pack" }
arkdown-sign = { path = "../arkdown-sign" }
arkdown-plugin-ets-transform = { path = "../arkdown-plugin-ets-transform" }
arkdown-plugin-chunk-wrapper = { path = "../arkdown-plugin-chunk-wrapper" }
arkdown-plugin-ohos-resolve = { path = "../arkdown-plugin-ohos-resolve" }
arkdown-plugin-module-meta = { path = "../arkdown-plugin-module-meta" }
arkdown-plugin-duplicate-check = { path = "../arkdown-plugin-duplicate-check" }
arkdown-plugin-json5 = { path = "../arkdown-plugin-json5" }
arkdown-resolver = { path = "../arkdown-resolver" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
fs-err = { workspace = true }
