name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_hvigor_parity:
        description: "Run SDK-backed hvigor parity on a self-hosted ohos-sdk runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace libraries
        run: cargo test --workspace --lib

      - name: Test workspace integration tests
        run: cargo test --workspace --test '*'
        env:
          ARKDOWN_PARITY_RUN: ""

      - name: Build arkdown CLI
        run: cargo build -p arkdown-napi --bin arkdown

  hvigor-parity:
    name: Hvigor Parity
    runs-on:
      - self-hosted
      - ohos-sdk
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hvigor_parity }}
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-parity-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-parity-cargo-

      - name: Verify SDK environment
        run: |
          test -n "$ARKDOWN_PARITY_HVIGORW"
          test -x "$ARKDOWN_PARITY_HVIGORW"
          test -n "$OHOS_SDK_HOME"
          test -d "$OHOS_SDK_HOME"
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Build arkdown CLI
        run: cargo build --release -p arkdown-napi --bin arkdown

      - name: Run hvigor parity tests
        run: cargo test -p arkdown-napi --test hvigor_parity -- --nocapture
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          ARKDOWN_PARITY_ARKDOWN_BIN: target/release/arkdown
          ARKDOWN_PARITY_RUN: "1"
          ARKDOWN_PARITY_STRICT: "1"
          ARKDOWN_PARITY_ALLOWLIST: tests/parity_allowlist.json
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.sha }}
          path: target/parity-reports/
          if-no-files-found: ignore
          retention-days: 30
