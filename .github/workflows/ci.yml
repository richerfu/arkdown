name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_package:
        description: "Publish packages/arkdown after all CI and platform checks pass"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  OHOS_SDK_VERSION: "6.0"
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.99.0"
  LINUX_BUILD_DEPENDENCIES: >-
    build-essential ca-certificates clang cmake libssl-dev ninja-build perl
    pkg-config python3

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes $LINUX_BUILD_DEPENDENCIES

      - name: Setup OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v0.2
        with:
          version: ${{ env.OHOS_SDK_VERSION }}
          components: all

      - name: Configure OpenHarmony SDK environment
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sdk_home="${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}"
          test -n "$sdk_home"
          test -d "$sdk_home/ets/build-tools/ets-loader"
          test -x "$sdk_home/toolchains/restool"
          case "${{ runner.os }}" in
            Linux) platform_dir="build-linux" ;;
            macOS) platform_dir="build-mac" ;;
            *) echo "unsupported SDK host: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          es2abc="$sdk_home/ets/build-tools/ets-loader/bin/ark/$platform_dir/bin/es2abc"
          if [[ ! -x "$es2abc" ]]; then
            es2abc="$sdk_home/ets/build-tools/ets-loader/bin/ark/build/bin/es2abc"
          fi
          test -x "$es2abc"
          echo "OHOS_BASE_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"

      - name: Configure OpenHarmony SDK environment on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkHome = '${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}'
          if ($sdkHome -match '^/([A-Za-z])(?:/(.*))?$') {
            $drive = $Matches[1].ToUpperInvariant()
            $tail = $Matches[2] -replace '/', '\'
            $sdkHome = "${drive}:\$tail"
          } elseif ($sdkHome.StartsWith('/')) {
            $cygpath = Get-Command cygpath.exe -ErrorAction SilentlyContinue
            if (-not $cygpath) {
              throw "Cannot convert MSYS SDK path without cygpath.exe: $sdkHome"
            }
            $sdkHome = (& $cygpath.Source -w $sdkHome).Trim()
          }
          if (-not $sdkHome) {
            throw 'OpenHarmony SDK action returned an empty host SDK path'
          }
          if (-not (Test-Path -PathType Container (Join-Path $sdkHome 'ets/build-tools/ets-loader'))) {
            throw "Missing ets-loader under $sdkHome"
          }
          if (-not (Test-Path -PathType Leaf (Join-Path $sdkHome 'toolchains/restool.exe'))) {
            throw "Missing restool.exe under $sdkHome"
          }
          $es2abc = Join-Path $sdkHome 'ets/build-tools/ets-loader/bin/ark/build-win/bin/es2abc.exe'
          if (-not (Test-Path -PathType Leaf $es2abc)) {
            $es2abc = Join-Path $sdkHome 'ets/build-tools/ets-loader/bin/ark/build/bin/es2abc.exe'
          }
          if (-not (Test-Path -PathType Leaf $es2abc)) {
            throw "Missing es2abc.exe under $sdkHome"
          }
          "OHOS_BASE_SDK_HOME=$sdkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OHOS_SDK_HOME=$sdkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Verify Rust environment
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Test workspace libraries
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --lib

      - name: Test workspace integration tests
        if: runner.os != 'Windows'
        run: cargo test --locked --workspace --test '*'
        env:
          ARKDOWN_PARITY_RUN: ""

      - name: Test Windows portability contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked -p arkdown-path --lib
          cargo test --locked -p arkdown-config --lib sdk::tests
          cargo test --locked -p arkdown-session --lib sdk_tools::tests
          cargo test --locked -p arkdown-ohpm --lib tarball::tests
          cargo test --locked -p arkdown-profile --lib test_transitive_dependency_resolves_from_issuer_ohpm_symlink_farm
          cargo test --locked -p arkdown-resolver --lib test_nested_ohpm_scoped_symlink_dependency_resolves_from_importer_package_store
          cargo test --locked -p arkdown-ets-transform --lib snapshot_resolves_source_files_through_indexed_aliases
          cargo test --locked -p arkdown-napi --lib bytecode::compiler
          cargo test --locked -p arkdown-napi --lib native_declaration_roots_follow_ohpm_symlinks
          cargo test --locked -p arkdown-napi --lib collect_debug_symbol_prefers_intermediate_map_and_copies_name_cache
          cargo test --locked -p arkdown-napi --test golden_test test_loader_json_golden_minimal_hap
          cargo test --locked -p arkdown-napi --test self_consistency_test test_minimal_hap_build_is_deterministic

      - name: Build native binding library
        run: cargo build --locked -p arkdown-napi --lib

  hvigor-parity:
    name: Hvigor Parity
    runs-on:
      - self-hosted
      - ohos-sdk
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Verify Rust environment
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-parity-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-parity-cargo-

      - name: Verify SDK environment
        run: |
          test -n "$ARKDOWN_PARITY_HVIGORW"
          test -x "$ARKDOWN_PARITY_HVIGORW"
          test -n "$OHOS_SDK_HOME"
          test -d "$OHOS_SDK_HOME"
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.1"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build binding for the JavaScript CLI
        working-directory: packages/arkdown
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test embedded compiler and build through Node
        working-directory: packages/arkdown
        run: node --test __test__/native-checker.e2e.cjs __test__/native-plugin.e2e.cjs
        env:
          ARKDOWN_NATIVE_CHECKER_E2E: "1"
          ARKDOWN_NATIVE_PLUGIN_E2E: "1"
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Run hvigor parity tests
        run: cargo test --locked -p arkdown-napi --test hvigor_parity -- --nocapture
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          ARKDOWN_PARITY_ARKDOWN_CLI: ${{ github.workspace }}/packages/arkdown/js/arkdown-cli.js
          ARKDOWN_PARITY_RUN: "1"
          ARKDOWN_PARITY_STRICT: "1"
          ARKDOWN_PARITY_ALLOWLIST: tests/parity_allowlist.json
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.sha }}
          path: target/parity/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package arkdown
    needs:
      - rust
      - hvigor-parity
    if: >-
      ${{
        always() &&
        needs.rust.result == 'success' &&
        needs.hvigor-parity.result == 'success'
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      publish: >-
        ${{
          (github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            startsWith(github.event.head_commit.message, 'chore(release): publish')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_package)
        }}
    secrets: inherit
