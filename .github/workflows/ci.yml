name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_hvigor_parity:
        description: "Run SDK-backed hvigor parity on a self-hosted ohos-sdk runner"
        required: false
        default: false
        type: boolean
      publish_package:
        description: "Publish packages/arkdown after all CI and platform checks pass"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  OHOS_SDK_VERSION: "6.0"
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.95.0"
  LINUX_BUILD_DEPENDENCIES: >-
    build-essential ca-certificates clang cmake libssl-dev ninja-build perl
    pkg-config python3

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes $LINUX_BUILD_DEPENDENCIES

      - name: Setup OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v0.2
        with:
          version: ${{ env.OHOS_SDK_VERSION }}
          components: all

      - name: Configure OpenHarmony SDK environment
        shell: bash
        run: |
          sdk_home="${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}"
          test -n "$sdk_home"
          test -d "$sdk_home/ets/build-tools/ets-loader"
          test -x "$sdk_home/toolchains/restool"
          case "${{ runner.os }}" in
            Linux) platform_dir="build-linux" ;;
            macOS) platform_dir="build-mac" ;;
            *) echo "unsupported SDK host: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          es2abc="$sdk_home/ets/build-tools/ets-loader/bin/ark/$platform_dir/bin/es2abc"
          if [[ ! -x "$es2abc" ]]; then
            es2abc="$sdk_home/ets/build-tools/ets-loader/bin/ark/build/bin/es2abc"
          fi
          test -x "$es2abc"
          echo "OHOS_BASE_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Verify Rust environment
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets

      - name: Test workspace libraries
        run: cargo test --locked --workspace --lib

      - name: Test workspace integration tests
        run: cargo test --locked --workspace --test '*'
        env:
          ARKDOWN_PARITY_RUN: ""

      - name: Build arkdown CLI
        run: cargo build --locked -p arkdown-napi --bin arkdown

  hvigor-parity:
    name: Hvigor Parity
    runs-on:
      - self-hosted
      - ohos-sdk
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hvigor_parity }}
    needs: rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Verify Rust environment
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-parity-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-parity-cargo-

      - name: Verify SDK environment
        run: |
          test -n "$ARKDOWN_PARITY_HVIGORW"
          test -x "$ARKDOWN_PARITY_HVIGORW"
          test -n "$OHOS_SDK_HOME"
          test -d "$OHOS_SDK_HOME"
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Build arkdown CLI
        run: cargo build --locked --release -p arkdown-napi --bin arkdown

      - name: Run hvigor parity tests
        run: cargo test --locked -p arkdown-napi --test hvigor_parity -- --nocapture
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          ARKDOWN_PARITY_ARKDOWN_BIN: target/release/arkdown
          ARKDOWN_PARITY_RUN: "1"
          ARKDOWN_PARITY_STRICT: "1"
          ARKDOWN_PARITY_ALLOWLIST: tests/parity_allowlist.json
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.sha }}
          path: target/parity-reports/
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Package arkdown
    needs:
      - rust
      - hvigor-parity
    if: >-
      ${{
        always() &&
        needs.rust.result == 'success' &&
        (needs.hvigor-parity.result == 'success' || needs.hvigor-parity.result == 'skipped')
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      publish: >-
        ${{
          (github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            startsWith(github.event.head_commit.message, 'chore(release): publish')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_package)
        }}
    secrets: inherit
