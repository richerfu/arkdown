name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_hvigor_parity:
        description: 'Run strict Hvigor parity on a configured self-hosted SDK runner'
        required: false
        default: false
        type: boolean
      publish_package:
        description: 'Publish packages/arkdown after all CI and platform checks pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  OHOS_SDK_VERSION: '6.0'
  RUST_BACKTRACE: '1'
  RUST_TOOLCHAIN: '1.99.0'
  LINUX_BUILD_DEPENDENCIES: >-
    build-essential ca-certificates clang cmake libssl-dev ninja-build perl
    pkg-config python3

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/arkdown/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install package dependencies
        working-directory: packages/arkdown
        run: pnpm install --frozen-lockfile

      - name: Install Rust formatting tools
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint JavaScript and TypeScript
        working-directory: packages/arkdown
        run: pnpm lint

      - name: Check JavaScript and workflow formatting
        working-directory: packages/arkdown
        run: pnpm format:check

      - name: Test JavaScript package
        working-directory: packages/arkdown
        run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/arkdown/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install package dependencies
        working-directory: packages/arkdown
        run: pnpm install --frozen-lockfile

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          read -r -a build_dependencies <<< "$LINUX_BUILD_DEPENDENCIES"
          sudo apt-get install --no-install-recommends --yes "${build_dependencies[@]}"

      - name: Setup OpenHarmony SDK
        id: setup-ohos-sdk
        uses: openharmony-rs/setup-ohos-sdk@v0.2
        with:
          version: ${{ env.OHOS_SDK_VERSION }}
          components: all

      - name: Configure OpenHarmony SDK environment
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sdk_home="${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}"
          test -n "$sdk_home"
          test -d "$sdk_home/ets/build-tools/ets-loader"
          test -x "$sdk_home/toolchains/restool"
          case "${{ runner.os }}" in
            Linux) platform_dir="build-linux" ;;
            macOS) platform_dir="build-mac" ;;
            *) echo "unsupported SDK host: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          es2abc="$sdk_home/ets/build-tools/ets-loader/bin/ark/$platform_dir/bin/es2abc"
          if [[ ! -x "$es2abc" ]]; then
            es2abc="$sdk_home/ets/build-tools/ets-loader/bin/ark/build/bin/es2abc"
          fi
          test -x "$es2abc"
          echo "OHOS_BASE_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$sdk_home" >> "$GITHUB_ENV"

      - name: Configure OpenHarmony SDK environment on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkHome = '${{ steps.setup-ohos-sdk.outputs.ohos-base-sdk-home }}'
          if ($sdkHome -match '^/([A-Za-z])(?:/(.*))?$') {
            $drive = $Matches[1].ToUpperInvariant()
            $tail = $Matches[2] -replace '/', '\'
            $sdkHome = "${drive}:\$tail"
          } elseif ($sdkHome.StartsWith('/')) {
            $cygpath = Get-Command cygpath.exe -ErrorAction SilentlyContinue
            if (-not $cygpath) {
              throw "Cannot convert MSYS SDK path without cygpath.exe: $sdkHome"
            }
            $sdkHome = (& $cygpath.Source -w $sdkHome).Trim()
          }
          if (-not $sdkHome) {
            throw 'OpenHarmony SDK action returned an empty host SDK path'
          }
          if (-not (Test-Path -PathType Container (Join-Path $sdkHome 'ets/build-tools/ets-loader'))) {
            throw "Missing ets-loader under $sdkHome"
          }
          if (-not (Test-Path -PathType Leaf (Join-Path $sdkHome 'toolchains/restool.exe'))) {
            throw "Missing restool.exe under $sdkHome"
          }
          $es2abc = Join-Path $sdkHome 'ets/build-tools/ets-loader/bin/ark/build-win/bin/es2abc.exe'
          if (-not (Test-Path -PathType Leaf $es2abc)) {
            $es2abc = Join-Path $sdkHome 'ets/build-tools/ets-loader/bin/ark/build/bin/es2abc.exe'
          }
          if (-not (Test-Path -PathType Leaf $es2abc)) {
            throw "Missing es2abc.exe under $sdkHome"
          }
          "OHOS_BASE_SDK_HOME=$sdkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OHOS_SDK_HOME=$sdkHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install local SDK checker mocks
        run: node packages/arkdown/scripts/prepare-test-sdk.cjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Verify Rust environment
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        id: cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-ci-v3-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**', 'packages/arkdown/Cargo.toml', 'packages/arkdown/build.rs', 'packages/arkdown/src/**', 'packages/arkdown/tests/**', 'tests/**', '.cargo/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-ci-v3-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-ci-v3-

      - name: Clippy workspace and all test targets
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings

      - name: Test workspace libraries and integration tests
        run: cargo test --locked --workspace --lib --tests --no-fail-fast
        env:
          ARKDOWN_PARITY_RUN: ''

      - name: Build native binding
        working-directory: packages/arkdown
        run: pnpm exec napi build --platform -- --locked

      - name: Test native binding and JavaScript CLI
        working-directory: packages/arkdown
        run: pnpm test && pnpm smoke && pnpm test:e2e
        shell: bash
        env:
          ARKDOWN_NATIVE_CHECKER_E2E: '1'
          ARKDOWN_NATIVE_PLUGIN_E2E: '1'
          ARKDOWN_NATIVE_CACHE_E2E: '1'
          ARKDOWN_NATIVE_WATCH_E2E: '1'

      - name: Save Cargo cache after checks
        timeout-minutes: 15
        continue-on-error: true
        if: >-
          !cancelled() && steps.cargo-cache.outputs.cache-primary-key != '' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  hvigor-parity:
    name: Hvigor Parity
    # Enable automatic parity with this repository variable once the runner and
    # SDK secrets exist. Releases always require strict parity.
    if: >-
      vars.ARKDOWN_HVIGOR_PARITY == 'true' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_hvigor_parity || inputs.publish_package)) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore(release): publish'))
    runs-on:
      - self-hosted
      - ohos-sdk
    needs: rust
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Verify Rust environment
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-parity-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-parity-cargo-

      - name: Verify SDK environment
        run: |
          test -n "$ARKDOWN_PARITY_HVIGORW"
          test -x "$ARKDOWN_PARITY_HVIGORW"
          test -n "$OHOS_SDK_HOME"
          test -d "$OHOS_SDK_HOME"
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.12.1'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build binding for the JavaScript CLI
        working-directory: packages/arkdown
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test embedded compiler and build through Node
        working-directory: packages/arkdown
        run: node --test __test__/native-checker.e2e.cjs __test__/native-plugin.e2e.cjs
        env:
          ARKDOWN_NATIVE_CHECKER_E2E: '1'
          ARKDOWN_NATIVE_PLUGIN_E2E: '1'
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Run hvigor parity tests
        run: cargo test --locked -p arkdown-napi --test hvigor_parity -- --nocapture
        env:
          ARKDOWN_PARITY_HVIGORW: ${{ secrets.HVIGORW_PATH }}
          ARKDOWN_PARITY_ARKDOWN_CLI: ${{ github.workspace }}/packages/arkdown/js/arkdown-cli.js
          ARKDOWN_PARITY_RUN: '1'
          ARKDOWN_PARITY_STRICT: '1'
          ARKDOWN_PARITY_ALLOWLIST: tests/parity_allowlist.json
          OHOS_SDK_HOME: ${{ secrets.OHOS_SDK_PATH }}

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.sha }}
          path: target/parity/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package arkdown
    needs:
      - quality
      - rust
      - hvigor-parity
    if: >-
      ${{
        always() &&
        needs.quality.result == 'success' &&
        needs.rust.result == 'success' &&
        (needs.hvigor-parity.result == 'success' || needs.hvigor-parity.result == 'skipped')
      }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      publish: >-
        ${{
          (github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            startsWith(github.event.head_commit.message, 'chore(release): publish')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_package)
        }}
    secrets: inherit
