name: Publish arkdown npm package

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish assembled platform packages to npm"
        required: false
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

env:
  APP_NAME: arkdown
  CARGO_INCREMENTAL: "1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  DEBUG: napi:*
  LINUX_BUILD_DEPENDENCIES: >-
    build-essential ca-certificates clang cmake libssl-dev ninja-build perl
    pkg-config python3
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  PNPM_VERSION: "10.12.1"
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.99.0"

defaults:
  run:
    working-directory: packages/arkdown

jobs:
  verify:
    name: Verify package environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes $LINUX_BUILD_DEPENDENCIES

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-verify-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-verify-cargo-

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain and package manager
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --version
          cargo clippy --version
          node --version
          pnpm --version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path ../../Cargo.toml --check

      - name: Check NAPI package
        run: cargo check --locked -p arkdown-napi --all-targets

      - name: Check package formatting
        run: pnpm exec prettier package.json ../../.github/workflows/publish.yml --check

      - name: Test JavaScript package
        run: pnpm test

  build:
    name: Build ${{ matrix.settings.target }}
    needs: verify
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: pnpm build --target x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm build --target x86_64-unknown-linux-gnu --use-napi-cross

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes $LINUX_BUILD_DEPENDENCIES

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: ${{ runner.os }}-${{ matrix.settings.target }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-rust-${{ env.RUST_TOOLCHAIN }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned compiler crates
        run: node scripts/compiler-source.mjs --verify

      - name: Build binding
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Test embedded compiler snapshots
        shell: bash
        run: cargo test --locked -p arkdown-ets-checker --test native

      - name: Upload binding
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/arkdown/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macos-windows:
    name: Test ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
        node:
          - "20"
          - "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download binding
        uses: actions/download-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/arkdown

      - name: Test JavaScript and native binding
        run: pnpm test && pnpm smoke
        shell: bash

  test-linux:
    name: Test x86_64-unknown-linux-gnu - node@${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "20"
          - "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download binding
        uses: actions/download-artifact@v7
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: packages/arkdown

      - name: Test JavaScript and native binding
        run: pnpm test && pnpm smoke
        shell: bash

  publish:
    name: Publish npm packages
    needs:
      - test-macos-windows
      - test-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
          cache-dependency-path: packages/arkdown/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publish environment
        run: |
          node --version
          npm --version
          pnpm --version
          pnpm exec napi --version

      - name: Download all bindings
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          path: packages/arkdown/artifacts

      - name: Assemble platform packages
        run: |
          pnpm exec napi create-npm-dirs
          pnpm artifacts

      - name: Materialize package README
        run: |
          test -L README.md
          unlink README.md
          cp ../../README.md README.md
          cmp ../../README.md README.md

      - name: Prepare and validate npm packages
        run: |
          pnpm exec napi pre-publish --no-gh-release -t npm --skip-optional-publish
          node scripts/compiler-source.mjs --package npm
          for child_directory in ./npm/darwin-arm64 ./npm/linux-x64-gnu ./npm/win32-x64-msvc; do
            npm pack "$child_directory" --dry-run --ignore-scripts --json >/dev/null
          done
          npm pack . --dry-run --ignore-scripts --json >/dev/null

      - name: Inspect packages
        run: ls -R npm

      - name: Publish to npm
        if: inputs.publish
        run: |
          NPM_TAG=$(node -p "const version = require('./package.json').version; const match = version.match(/^[^-]+-([0-9A-Za-z]+)(?:[.-].*)?$/); match ? match[1] : 'latest'")
          echo "Publishing with npm dist-tag: ${NPM_TAG}"
          export npm_config_tag="${NPM_TAG}"
          export NPM_CONFIG_PROVENANCE=true
          for child_directory in ./npm/darwin-arm64 ./npm/linux-x64-gnu ./npm/win32-x64-msvc; do
            npm publish "$child_directory" --ignore-scripts --provenance --access public --tag "${NPM_TAG}"
          done
          npm publish --ignore-scripts --provenance --access public --tag "${NPM_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
