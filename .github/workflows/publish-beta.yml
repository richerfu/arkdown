name: Publish arkdown prerelease to npm

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (beta, rc, next, ...)'
        required: true
        default: beta
        type: string
      version:
        description: 'Expected packages/arkdown version; leave empty to skip the check'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build and pack without uploading'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate version and dist-tag
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/arkdown/package.json').version")
          if [ -n "$EXPECTED_VERSION" ] && [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "package version '$version' does not match expected '$EXPECTED_VERSION'" >&2
            exit 1
          fi
          if [[ "$version" != *-* ]]; then
            echo "version '$version' is not a prerelease; use the stable release flow" >&2
            exit 1
          fi
          if [[ ! "$DIST_TAG" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || [ "$DIST_TAG" = "latest" ]; then
            echo "invalid prerelease dist-tag '$DIST_TAG'" >&2
            exit 1
          fi

  publish:
    name: Publish prerelease
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      publish: ${{ !inputs.dry_run }}
      dist_tag: ${{ inputs.dist_tag }}
    secrets: inherit
